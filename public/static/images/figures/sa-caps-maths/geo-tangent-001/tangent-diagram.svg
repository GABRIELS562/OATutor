<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>

  <!-- Circle with center O -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Center point O -->
  <circle cx="150" cy="150" r="4" fill="#2563eb"/>
  <text x="140" y="145" font-family="Arial" font-size="14" fill="#2563eb" font-weight="bold">O</text>

  <!-- Point A on circle (tangent point) -->
  <circle cx="230" cy="150" r="4" fill="#dc2626"/>
  <text x="238" y="155" font-family="Arial" font-size="14" fill="#dc2626" font-weight="bold">A</text>

  <!-- Point P (external point) -->
  <circle cx="330" cy="30" r="4" fill="#16a34a"/>
  <text x="338" y="35" font-family="Arial" font-size="14" fill="#16a34a" font-weight="bold">P</text>

  <!-- Radius OA = 5 -->
  <line x1="150" y1="150" x2="230" y2="150" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="168" font-family="Arial" font-size="12" fill="#2563eb">5 cm</text>

  <!-- Line OP = 13 -->
  <line x1="150" y1="150" x2="330" y2="30" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="220" y="80" font-family="Arial" font-size="12" fill="#7c3aed">13 cm</text>

  <!-- Tangent PA (what we need to find) -->
  <line x1="230" y1="150" x2="330" y2="30" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="105" font-family="Arial" font-size="12" fill="#dc2626">PA = ?</text>

  <!-- Right angle symbol at A -->
  <path d="M 218 150 L 218 138 L 230 138" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Legend -->
  <text x="20" y="270" font-family="Arial" font-size="11" fill="#666">PA is tangent to circle O at point A</text>
  <text x="20" y="285" font-family="Arial" font-size="11" fill="#666">OA is radius, OP passes through center</text>
</svg>
