<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="450" height="320">
  <!-- Background -->
  <rect width="450" height="320" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="225" y="25" font-family="Arial" font-size="16" fill="#1e40af" font-weight="bold" text-anchor="middle">Special Angle Values</text>

  <!-- Unit Circle -->
  <circle cx="150" cy="170" r="100" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Axes -->
  <line x1="30" y1="170" x2="270" y2="170" stroke="#333" stroke-width="1"/>
  <line x1="150" y1="50" x2="150" y2="290" stroke="#333" stroke-width="1"/>

  <!-- 30° line -->
  <line x1="150" y1="170" x2="237" y2="120" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="115" font-family="Arial" font-size="11" fill="#dc2626">30°</text>

  <!-- 45° line -->
  <line x1="150" y1="170" x2="221" y2="99" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="90" font-family="Arial" font-size="11" fill="#16a34a">45°</text>

  <!-- 60° line -->
  <line x1="150" y1="170" x2="200" y2="84" stroke="#7c3aed" stroke-width="2"/>
  <text x="205" y="75" font-family="Arial" font-size="11" fill="#7c3aed">60°</text>

  <!-- 75° line (compound) -->
  <line x1="150" y1="170" x2="176" y2="73" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="170" y="60" font-family="Arial" font-size="11" fill="#ea580c" font-weight="bold">75°</text>

  <!-- Values table -->
  <rect x="280" y="50" width="160" height="240" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <text x="360" y="70" font-family="Arial" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">Exact Values</text>

  <line x1="280" y1="80" x2="440" y2="80" stroke="#ddd"/>

  <!-- Header row -->
  <text x="300" y="100" font-family="Arial" font-size="11" fill="#666">θ</text>
  <text x="340" y="100" font-family="Arial" font-size="11" fill="#666">cos θ</text>
  <text x="400" y="100" font-family="Arial" font-size="11" fill="#666">sin θ</text>

  <line x1="280" y1="110" x2="440" y2="110" stroke="#ddd"/>

  <!-- 30° row -->
  <text x="300" y="130" font-family="Arial" font-size="11" fill="#dc2626">30°</text>
  <text x="340" y="130" font-family="Arial" font-size="11" fill="#333">√3/2</text>
  <text x="400" y="130" font-family="Arial" font-size="11" fill="#333">1/2</text>

  <!-- 45° row -->
  <text x="300" y="155" font-family="Arial" font-size="11" fill="#16a34a">45°</text>
  <text x="340" y="155" font-family="Arial" font-size="11" fill="#333">√2/2</text>
  <text x="400" y="155" font-family="Arial" font-size="11" fill="#333">√2/2</text>

  <!-- 60° row -->
  <text x="300" y="180" font-family="Arial" font-size="11" fill="#7c3aed">60°</text>
  <text x="340" y="180" font-family="Arial" font-size="11" fill="#333">1/2</text>
  <text x="400" y="180" font-family="Arial" font-size="11" fill="#333">√3/2</text>

  <line x1="280" y1="195" x2="440" y2="195" stroke="#ddd"/>

  <!-- 75° result -->
  <text x="300" y="215" font-family="Arial" font-size="11" fill="#ea580c" font-weight="bold">75°</text>
  <text x="315" y="235" font-family="Arial" font-size="10" fill="#ea580c">=45°+30°</text>

  <text x="340" y="225" font-family="Arial" font-size="10" fill="#333">(√6-√2)/4</text>

  <!-- Formula -->
  <text x="290" y="270" font-family="Arial" font-size="10" fill="#666">cos(A+B) = cosA·cosB - sinA·sinB</text>
</svg>
