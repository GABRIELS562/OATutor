<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Background -->
  <rect width="400" height="350" fill="#f8f9fa"/>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="350" fill="url(#grid)"/>

  <!-- Axes -->
  <line x1="50" y1="250" x2="370" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="320" x2="110" y2="30" stroke="#333" stroke-width="2"/>

  <!-- X-axis labels -->
  <text x="140" y="268" font-family="Arial" font-size="11" fill="#666">1</text>
  <text x="170" y="268" font-family="Arial" font-size="11" fill="#666">2</text>
  <text x="200" y="268" font-family="Arial" font-size="11" fill="#666">3</text>
  <text x="230" y="268" font-family="Arial" font-size="11" fill="#666">4</text>
  <text x="260" y="268" font-family="Arial" font-size="11" fill="#666">5</text>
  <text x="290" y="268" font-family="Arial" font-size="11" fill="#666">6</text>
  <text x="320" y="268" font-family="Arial" font-size="11" fill="#666">7</text>
  <text x="365" y="255" font-family="Arial" font-size="12" fill="#333">x</text>

  <!-- Y-axis labels -->
  <text x="90" y="224" font-family="Arial" font-size="11" fill="#666">1</text>
  <text x="90" y="194" font-family="Arial" font-size="11" fill="#666">2</text>
  <text x="90" y="164" font-family="Arial" font-size="11" fill="#666">3</text>
  <text x="115" y="35" font-family="Arial" font-size="12" fill="#333">y</text>
  <text x="85" y="284" font-family="Arial" font-size="11" fill="#666">-1</text>
  <text x="85" y="314" font-family="Arial" font-size="11" fill="#666">-2</text>

  <!-- Circle with center M(3, -2) and radius 5 -->
  <circle cx="200" cy="310" r="150" fill="rgba(59,130,246,0.1)" stroke="#2563eb" stroke-width="2"/>

  <!-- Center M(3, -2) -->
  <circle cx="200" cy="310" r="5" fill="#dc2626"/>
  <text x="210" y="325" font-family="Arial" font-size="12" fill="#dc2626" font-weight="bold">M(3, -2)</text>

  <!-- Point P(7, 1) on circle -->
  <circle cx="320" cy="220" r="5" fill="#16a34a"/>
  <text x="328" y="215" font-family="Arial" font-size="12" fill="#16a34a" font-weight="bold">P(7, 1)</text>

  <!-- Radius line from M to P -->
  <line x1="200" y1="310" x2="320" y2="220" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="240" y="255" font-family="Arial" font-size="11" fill="#7c3aed">r = 5</text>

  <!-- Formula box -->
  <rect x="250" y="40" width="140" height="60" fill="#fff" stroke="#ddd" rx="5"/>
  <text x="260" y="60" font-family="Arial" font-size="10" fill="#333">Distance formula:</text>
  <text x="260" y="78" font-family="Arial" font-size="10" fill="#2563eb">d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
  <text x="260" y="93" font-family="Arial" font-size="10" fill="#666">r = √[(7-3)² + (1-(-2))²]</text>
</svg>
