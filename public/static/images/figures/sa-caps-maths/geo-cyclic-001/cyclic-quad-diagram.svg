<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Background -->
  <rect width="400" height="350" fill="#f8f9fa"/>

  <!-- Circle -->
  <circle cx="200" cy="175" r="120" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Cyclic quadrilateral ABCD -->
  <!-- Point A (top) -->
  <circle cx="200" cy="55" r="4" fill="#dc2626"/>
  <text x="195" y="45" font-family="Arial" font-size="14" fill="#dc2626" font-weight="bold">A</text>
  <text x="155" y="75" font-family="Arial" font-size="12" fill="#dc2626">72°</text>

  <!-- Point B (right) -->
  <circle cx="310" cy="135" r="4" fill="#16a34a"/>
  <text x="318" y="140" font-family="Arial" font-size="14" fill="#16a34a" font-weight="bold">B</text>
  <text x="280" y="155" font-family="Arial" font-size="12" fill="#16a34a">85°</text>

  <!-- Point C (bottom) -->
  <circle cx="260" cy="285" r="4" fill="#7c3aed"/>
  <text x="265" y="305" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="bold">C</text>
  <text x="235" y="270" font-family="Arial" font-size="12" fill="#7c3aed">?</text>

  <!-- Point D (left) -->
  <circle cx="90" cy="215" r="4" fill="#ea580c"/>
  <text x="70" y="220" font-family="Arial" font-size="14" fill="#ea580c" font-weight="bold">D</text>
  <text x="105" y="205" font-family="Arial" font-size="12" fill="#ea580c">?</text>

  <!-- Quadrilateral sides -->
  <polygon points="200,55 310,135 260,285 90,215" fill="rgba(59,130,246,0.1)" stroke="#1e40af" stroke-width="2"/>

  <!-- Center point -->
  <circle cx="200" cy="175" r="3" fill="#666"/>

  <!-- Legend -->
  <text x="20" y="325" font-family="Arial" font-size="11" fill="#666">ABCD is a cyclic quadrilateral</text>
  <text x="20" y="340" font-family="Arial" font-size="11" fill="#666">Opposite angles are supplementary (A+C=180°, B+D=180°)</text>
</svg>
