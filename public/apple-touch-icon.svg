<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B2FF7"/>
      <stop offset="100%" style="stop-color:#F72585"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B2FF7"/>
      <stop offset="100%" style="stop-color:#F72585"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="180" height="180" rx="36" ry="36" fill="url(#bgGrad)"/>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="180" height="6" rx="3" ry="3" fill="url(#accentGrad)"/>

  <!-- XYZ Text -->
  <text x="90" y="120"
        font-family="'Titillium Web', 'Segoe UI', Arial, sans-serif"
        font-size="70"
        font-weight="700"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="3">XYZ</text>
</svg>
