<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B2FF7"/>
      <stop offset="100%" style="stop-color:#F72585"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B2FF7"/>
      <stop offset="100%" style="stop-color:#F72585"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- Accent bar at top -->
  <rect x="20" y="20" width="472" height="16" rx="8" ry="8" fill="url(#accentGrad)"/>

  <!-- XYZ Text -->
  <text x="256" y="340"
        font-family="'Titillium Web', 'Segoe UI', Arial, sans-serif"
        font-size="200"
        font-weight="700"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="10">XYZ</text>
</svg>
