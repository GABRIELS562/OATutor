name: Deploy Online Tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/online-tutor

jobs:
  # Build on GitHub's servers (powerful, reliable)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args for optimization
          build-args: |
            NODE_ENV=production

      - name: Output image info
        run: |
          echo "Built and pushed image:"
          echo "${{ steps.meta.outputs.tags }}"

  # Deploy on self-hosted runner (just pull and run - fast!)
  deploy:
    needs: build
    runs-on: [self-hosted, online-tutor]
    steps:
      - name: Deploy Application
        run: |
          echo "=== Online Tutor Deployment ==="
          echo "Timestamp: $(date)"

          # Login to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull the pre-built image (fast - no build needed!)
          echo "Pulling image from registry..."
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

          # Stop old container
          echo "Stopping old container..."
          docker stop online-tutor 2>/dev/null || true
          docker rm online-tutor 2>/dev/null || true

          # Start new container
          echo "Starting new container..."
          docker run -d \
            --name online-tutor \
            --restart unless-stopped \
            --network seattle-coffee-app_coffee-network \
            -p 3001:80 \
            --label "app=online-tutor" \
            --label "team=devops" \
            --health-cmd="wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1" \
            --health-interval=30s \
            --health-timeout=3s \
            --health-retries=3 \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

          # Wait and verify
          echo "Waiting for container to start..."
          sleep 5

          if docker ps | grep -q online-tutor; then
            echo "=== Deployment Successful ==="
            docker ps | grep online-tutor

            # Show container health
            echo ""
            echo "Container logs (last 10 lines):"
            docker logs --tail 10 online-tutor 2>&1 || true
          else
            echo "=== Deployment Failed ==="
            docker logs online-tutor 2>&1 || true
            exit 1
          fi

          # Cleanup old images (keep last 2)
          echo ""
          echo "Cleaning up old images..."
          docker image prune -f

          echo ""
          echo "=== Done ==="
