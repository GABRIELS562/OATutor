name: Deploy Online Tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, online-tutor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "=== Online Tutor Deployment ==="
          echo "Timestamp: $(date)"

          # Copy files to deployment directory
          sudo mkdir -p /opt/online-tutor
          sudo chown -R $USER:$USER /opt/online-tutor
          rsync -av --delete --exclude '.git' ./ /opt/online-tutor/

          cd /opt/online-tutor

          # Build Docker image
          echo "Building Docker image..."
          docker build -t online-tutor:latest .

          # Stop old container
          echo "Stopping old container..."
          docker stop online-tutor 2>/dev/null || true
          docker rm online-tutor 2>/dev/null || true

          # Start new container
          echo "Starting new container..."
          docker run -d \
            --name online-tutor \
            --restart unless-stopped \
            --network seattle-coffee-app_coffee-network \
            -p 3001:80 \
            --label "app=online-tutor" \
            --label "team=devops" \
            online-tutor:latest

          # Wait and verify
          sleep 5
          if docker ps | grep -q online-tutor; then
            echo "=== Deployment Successful ==="
            docker ps | grep online-tutor
          else
            echo "=== Deployment Failed ==="
            docker logs online-tutor
            exit 1
          fi

          # Cleanup old images
          docker image prune -f

          echo "=== Done ==="
