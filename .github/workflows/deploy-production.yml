name: Production CI (Legacy - Disabled)

# DISABLED: This is from the original CAHLR project and requires secrets not available in this fork.
# Deployment is handled by deploy.yml instead.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm (this workflow is deprecated)'
        required: true

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Add SSH private keys for submodule repositories
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.OATUTOR_CONTENT_DEPLOY_KEY }}

      - run: git submodule update --init --recursive

      - name: Save original git author and git email
        run: |
          echo "git_email=$(git log --format='%ae' HEAD^!)" >> $GITHUB_ENV
          echo "git_name=$(git log --format='%an' HEAD^!)" >> $GITHUB_ENV

      - uses: actions/setup-node@v2.4.1

      - name: Change homepage in package.json
        run: sed -i 's/place-holder/OATutor/g' package.json

      - name: Cache node modules
        uses: actions/cache@v3
        env:
            cache-name: cache-node-modules
        with:
            # npm cache files are stored in `~/.npm` on Linux/macOS
            path: ~/.npm
            key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
                ${{ runner.os }}-build-${{ env.cache-name }}-
                ${{ runner.os }}-build-
                ${{ runner.os }}-

      - name: Run CI install
        run: npm ci

      - name: Run build
        run: npm run build
        env:
          REACT_APP_FIREBASE_CONFIG: ${{ secrets.STAGING_FIREBASE_CONFIG }}
          CI: false
          REACT_APP_BUILD_TYPE: "production"
          REACT_APP_COMMIT_HASH: ${{ github.sha }}

      - uses: actions/checkout@v2
        with:
          ref: 'gh-pages'
          path: 'gh-build'

      - name: Push
        run: |
          cd gh-build
          git rm -rf .
          git clean -fxd
          rsync -av ../build/ .
          git add .
          git config --local user.email "${{ env.git_email }}"
          git config --local user.name "${{ env.git_name }}"
          git diff --cached --quiet --exit-code && echo "no changes to platform, exiting early" && exit 0
          git commit -m "deploy commit: CAHLR/OATutor@$GITHUB_SHA"
          git push
